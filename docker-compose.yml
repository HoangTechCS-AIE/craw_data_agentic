version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: olh
      POSTGRES_USER: olh
      POSTGRES_PASSWORD: olh
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://olh:olh@db:5432/olh
    volumes:
      - .:/app
    depends_on:
      - db

  airflow:
    image: apache/airflow:2.8.3
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./agent/scheduler/airflow/dags:/opt/airflow/dags
      - ./.env:/opt/olh/.env
    command: bash -c "airflow db upgrade && airflow users create --username admin --password admin --firstname Open --lastname Hub --role Admin --email admin@example.com && airflow scheduler"
    depends_on:
      - db

volumes:
  db_data:
  minio_data:
